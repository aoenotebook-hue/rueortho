name: CI

on:
  # Pull requests cover branch work; restricting push to main stops every PR
  # commit from running the same jobs twice.
  push:
    branches: [main]
  pull_request:

# A newer commit supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type and template checking. Kept at zero errors, warnings and hints.
      - run: npm run check

      # Editorial rules the schema cannot express — a SAMPLE article published
      # as reviewed, a published article with no sources, a Figure with no alt.
      - run: npm run lint:content

      - run: npm run build

      # Internal links must resolve. Offline mode resolves hrefs against the
      # built output and never touches the network, so this step fails only on
      # a genuinely broken internal link.
      #
      # `--include-fragments` is deliberately NOT set. Astro builds
      # directory-style pages, so /conditions/frozen-shoulder is a directory
      # holding index.html: lychee resolves that fine for a plain link but
      # cannot read ids out of it, and reported "Cannot find fragment" for all
      # 38 of the site's anchored links while every one of them worked. On this
      # site the flag can only produce false positives, so the anchor check is
      # the step below instead — it resolves the target the way a browser does.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

      # Every in-page anchor must point at an id that exists.
      - run: npm run lint:anchors

      # External links are reported but never block: a third-party outage is
      # not a reason to fail our build.
      - name: Check external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-all-private
            --accept 200,206,429
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true
          output: lychee-external.md
